Hotbar:
  StatusIndicator:
    resource: "/system"
    port: 8089
DashboardPanel: 
  MacrosWidget:
    header:
DevicePanel:
  DeviceInfoWidget:
    header:
    rows:
      - name: "SID"
        port: 8089
        resource: "/core/sid"
        component: "sid"
      - name: "IP address"
        port: 8089
        resource: "/core/ip_address"
        component: "ipAddress"
      - name: "Hostname"
        port: 8089
        resource: "/core/hostname"
        component: "hostname"
      - name: "Serial number"
        port: 8089
        resource: "/core/serial"
        component: "serial"
      - name: "Supply voltage"
        unit: "V"
        decimalPlaces: 2
        port: 8089
        resource: "/core/supply/5v"
        component: "voltage"
      - name: "Supply vin"
        unit: "V"
        decimalPlaces: 2
        port: 8089
        resource: "/core/supply/vin"
        component: "voltage"
      - name: "Supply poe"
        unit: "V"
        decimalPlaces: 2
        port: 8089
        resource: "/core/supply/poe"
        component: "voltage"
      - name: "Supply current"
        unit: "A"
        decimalPlaces: 2
        port: 8089
        resource: "/core/supply/current"
        component: "current"
      - name: "Supply power_draw"
        unit: "W"
        decimalPlaces: 2
        port: 8089
        resource: "/core/supply/power_draw"
        component: "power_draw"
  CanBusInfoWidget:
    header:
    rows:
      - name: rx_packets
        port: 8089
        resource: "/system/can/rx_packets"
        component: "rx_packets"
      - name: tx_packets
        port: 8089
        resource: "/system/can/tx_packets"
        component: "tx_packets"
      - name: rx_errors
        port: 8089
        resource: "/system/can/rx_errors"
        component: "rx_errors"
      - name: tx_errors
        port: 8089
        resource: "/system/can/tx_errors"
        component: "tx_errors"
      - name: rx_dropped
        port: 8089
        resource: "/system/can/rx_dropped"
        component: "rx_dropped"
      - name: tx_dropped
        port: 8089
        resource: "/system/can/tx_dropped"
        component: "tx_dropped"
      - name: collisions
        port: 8089
        resource: "/system/can/collisions"
        component: "collisions"